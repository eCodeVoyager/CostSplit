apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// One version for web and app: package.json "version" (2.1.3 -> code 20103)
def appVersion = new JsonSlurper().parse(file('../../package.json')).version
def (major, minor, patch) = appVersion.tokenize('.').collect { it.toInteger() }

// Release signing reads android/keystore.properties (never committed):
//   storeFile=../costsplit-release.jks  storePassword=...  keyAlias=costsplit  keyPassword=...
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

// Invite links (https://<host>/join/...) open the app: host = VITE_PUBLIC_URL of the release build
def appLinkHost = 'localhost'
def releaseEnv = file('../../.env.android-release')
if (releaseEnv.exists()) {
    def line = releaseEnv.readLines().find { it.startsWith('VITE_PUBLIC_URL=') }
    if (line) appLinkHost = new URI(line.substring('VITE_PUBLIC_URL='.length()).trim()).host ?: appLinkHost
}

android {
    namespace = "app.costsplit"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.costsplit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode major * 10000 + minor * 100 + patch
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Lets debug builds talk to a plain-http sync server on a laptop or LAN
            manifestPlaceholders = [usesCleartextTraffic: "true", appLinkHost: appLinkHost]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release builds only talk https
            manifestPlaceholders = [usesCleartextTraffic: "false", appLinkHost: appLinkHost]
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
