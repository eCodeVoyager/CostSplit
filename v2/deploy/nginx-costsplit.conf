# CostSplit v2: Cloudflare (proxied, SSL mode Full) -> nginx -> node on 127.0.0.1:PORT.
# DOMAIN and PORT are replaced by deploy/remote-setup.sh.

# Cloudflare rewrites "no-cache" to its 4 h browser TTL on .js/.css/.png/.apk, which would
# keep sw.js and the APK stale after a release. "private, no-cache" passes through untouched.
map $upstream_http_cache_control $costsplit_cache_control {
    "no-cache" "private, no-cache";
    default    $upstream_http_cache_control;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    ssl_certificate     /etc/nginx/ssl/costsplit.crt;
    ssl_certificate_key /etc/nginx/ssl/costsplit.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    access_log /var/log/nginx/costsplit-access.log;
    # Receipt photos are up to 3 MB
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The server rate-limits by the first X-Forwarded-For entry, so send only the real client IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control $costsplit_cache_control always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
